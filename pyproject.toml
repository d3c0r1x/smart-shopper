[project]
name = "smart-shopper"
version = "0.1.0"
description = "ИИ-ассистент покупок для Ozon и Яндекс Маркета: текстовый поиск, поиск по фото, анализ отзывов, сравнение цен"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "openai>=1.60",
    "curl_cffi>=0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
